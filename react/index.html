<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InventorySync (React): multi-store stock and alerts</title>
  <script>
    // Dark mode: a saved choice wins, otherwise follow the OS setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('inventorysync:theme'); } catch (e) {}
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', saved || (dark ? 'dark' : 'light'));
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

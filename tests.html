<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d6efd'/%3E%3Cpath d='M8 11l8-4 8 4v10l-8 4-8-4z M8 11l8 4 8-4 M16 15v10' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>InventorySync: critical-path checks</title>
  <!-- One version for every script, so the browser never mixes an old cached page with
       newer code. Change ASSET_VERSION (here and in the src below) on every release. -->
  <script type="importmap">
  {
    "imports": {
      "./js/app.js": "./js/app.js?v=2026-10-16-11",
      "./js/inventory.js": "./js/inventory.js?v=2026-10-16-11",
      "./js/store.js": "./js/store.js?v=2026-10-16-11",
      "./js/export.js": "./js/export.js?v=2026-10-16-11",
      "./js/ui.js": "./js/ui.js?v=2026-10-16-11",
      "./js/crypto.js": "./js/crypto.js?v=2026-10-16-11",
      "./js/admin-auth.js": "./js/admin-auth.js?v=2026-10-16-11",
      "./js/admin-panel.js": "./js/admin-panel.js?v=2026-10-16-11",
      "./js/bill.js": "./js/bill.js?v=2026-10-16-11",
      "./js/gst.js": "./js/gst.js?v=2026-10-16-11",
      "./js/tests.js": "./js/tests.js?v=2026-10-16-11"
    }
  }
  </script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    ol { padding-left: 1.5rem; }
    .pass { color: #146c43; }
    .fail { color: #b02a37; font-weight: 600; }
    #summary { font-weight: 600; }
  </style>
</head>
<body>
  <h1>InventorySync: critical-path checks</h1>
  <p>These run against in-memory test data only. Your saved app data is not touched.</p>
  <p id="summary" role="status">Running…</p>
  <ol id="results"></ol>

  <script type="module">
    import { runTests, checkSampleData, checkPasswordHashing } from './js/tests.js';

    const results = runTests();
    results.push(await checkSampleData());
    results.push(await checkPasswordHashing());

    const list = document.getElementById('results');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.passed ? 'pass' : 'fail';
      li.textContent = `${r.passed ? 'PASS' : 'FAIL'}: ${r.name}${r.error ? ` (${r.error})` : ''}`;
      list.append(li);
      console.log(li.textContent);
    }
    const failed = results.filter((r) => !r.passed).length;
    const summary = document.getElementById('summary');
    summary.textContent = failed === 0
      ? `All ${results.length} checks passed.`
      : `${failed} of ${results.length} checks failed.`;
    summary.className = failed === 0 ? 'pass' : 'fail';
  </script>
</body>
</html>
